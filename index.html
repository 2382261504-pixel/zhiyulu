<script>
  // 后端 zhiyu-api 一直托管在 CloudBase（service.tcloudbase.com），与前端域名无关；
  // 后端已开 CORS（Access-Control-Allow-Origin: *），故前端托管在任意域名都能跨域调用。
  // 仅本地联调（localhost / 127.0.0.1）走相对地址 /api/zhihu，其余一律走 API 网关绝对地址。
  var __h = location.hostname;
  if (__h && __h !== "localhost" && __h !== "127.0.0.1") {
    window.ZHIYU_API_BASE = "https://my-name-yyx-d0g5pjy204f53929a.service.tcloudbase.com/zhiyu-api/zhihu";
  // 兜底：部分国产浏览器（微信/QQ 大字模式等）会把「布局视口」压到固定宽度，
  // 导致页面只占屏幕左侧、右侧整片空白。检测到「可视视口明显宽于布局视口」时强制铺满。
  (function () {
    function fixVp() {
      try {
        var vv = window.visualViewport, lw = document.documentElement.clientWidth;
        if (vv && vv.scale <= 1.02 && vv.width > lw + 8 && lw < 620) {
          document.documentElement.style.width = Math.round(vv.width) + 'px';
        }
      } catch (e) {}
    }
    fixVp();
    window.addEventListener("resize", fixVp);
    window.addEventListener("orientationchange", fixVp);
  })();
  }
</script>
